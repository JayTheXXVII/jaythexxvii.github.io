    <script>

<!-- Nav Logic -->
  const horizSlider = document.querySelector('nav');
  if (horizSlider) {
    let isDownX = false;
    let startX;
    let scrollLeft;

    horizSlider.addEventListener('mousedown', (e) => {
      isDownX = true;
      startX = e.pageX - horizSlider.offsetLeft;
      scrollLeft = horizSlider.scrollLeft;
    });
    
    horizSlider.addEventListener('mouseleave', () => isDownX = false);
    horizSlider.addEventListener('mouseup', () => isDownX = false);

    horizSlider.addEventListener('mousemove', (e) => {
      if (!isDownX) return;
      e.preventDefault();
      const x = e.pageX - horizSlider.offsetLeft;
      const walk = (x - startX) * 2;
      horizSlider.scrollLeft = scrollLeft - walk;
    });
  }

  <!-- VERTICAL LIST SCROLL -->
  const vertSlider = document.querySelector('.drop-nav');
  if (vertSlider) {
    let isDownY = false;
    let startY;
    let scrollTop;

    vertSlider.addEventListener('mousedown', (e) => {
      isDownY = true;
      startY = e.pageY - vertSlider.offsetTop;
      scrollTop = vertSlider.scrollTop;
    });

    vertSlider.addEventListener('mouseleave', () => isDownY = false);
    vertSlider.addEventListener('mouseup', () => isDownY = false);

    vertSlider.addEventListener('mousemove', (e) => {
      if (!isDownY) return;
      e.preventDefault();
      const y = e.pageY - vertSlider.offsetTop;
      const walk = (y - startY) * 1.5;
      vertSlider.scrollTop = scrollTop - walk;
    });
  }

	<!-- Server Domain and Ping List -->
document.addEventListener("DOMContentLoaded", () => {
    const targetDomain = "xxvii.org";
    const allLinks = document.querySelectorAll("a");
    const outputList = document.getElementById("domain-links-output");

    allLinks.forEach(link => {
        const hrefValue = link.href;

        // Filter links that belong to your domain group
        if (hrefValue.includes(targetDomain)) {

            try {
                const urlObj = new URL(hrefValue);
                const hostname = urlObj.hostname;

                // Hide the main root domain homepage from the output list completely
                if (hostname === targetDomain && (urlObj.pathname === "/" || urlObj.pathname === "" || urlObj.pathname === "/#")) {
                    return; // Skip appending
                }

                const listItem = document.createElement("li");
                listItem.className = "link-item";

                // Create the initial gray dot element
                const dot = document.createElement("span");
                dot.className = "status-dot";

                // Create ping time display element
                const pingDisplay = document.createElement("span");
                pingDisplay.className = "ping-time";
                pingDisplay.textContent = "0ms";

                const anchor = document.createElement("a");
                anchor.href = hrefValue;
                anchor.textContent = hrefValue;
                anchor.target = "_blank";

                // Append elements in order: dot, ping, then URL
                listItem.appendChild(dot);
                listItem.appendChild(pingDisplay);
                listItem.appendChild(anchor);
                outputList.appendChild(listItem);

                // Run specific isolated status checkers matching individual subdomains
                if (hostname === 'searx.xxvii.org') {
                    checkSearxStatus(hrefValue, dot, pingDisplay);
                } else if (hostname === 'copyparty.xxvii.org') {
                    checkCopypartyStatus(hrefValue, dot, pingDisplay);
                } else if (hostname === 'ai.xxvii.org') {
                    checkAIStatus(hrefValue, dot, pingDisplay);
                } else {
                    // Fallback configuration for any other subdomains
                    checkCopypartyStatus(hrefValue, dot, pingDisplay);
                }

            } catch (e) {
                // Skips any non-http anchors (like tel:, mailto:, or anchor hashes)
            }
        }
    });
});

// Individual function for Copyparty using HEAD request approach
function checkCopypartyStatus(url, dotElement, pingElement) {
    // Set up periodic updates every 5 seconds
    const updateInterval = setInterval(() => {
        updatePingForUrl(url, dotElement, pingElement);
    }, 5000);
    
    // Initial check
    updatePingForUrl(url, dotElement, pingElement);
    
    // Store interval ID for potential cleanup
    return updateInterval;
}

// Individual function for Open WebUI using HEAD request approach with navigator.onLine check
function checkAIStatus(url, dotElement, pingElement) {
    // Set up periodic updates every 5 seconds
    const updateInterval = setInterval(() => {
        updatePingForUrl(url, dotElement, pingElement);
    }, 5000);
    
    // Initial check
    updatePingForUrl(url, dotElement, pingElement);
    
    // Store interval ID for potential cleanup
    return updateInterval;
}

// Individual function for SearXNG using its standalone Favicon
function checkSearxStatus(url, dotElement, pingElement) {
    // Set up periodic updates every 5 seconds
    const updateInterval = setInterval(() => {
        updateSearxPing(url, dotElement, pingElement);
    }, 5000);
    
    // Initial check
    updateSearxPing(url, dotElement, pingElement);
    
    // Store interval ID for potential cleanup
    return updateInterval;
}

// Helper function to update ping for SearXNG specifically
function updateSearxPing(url, dotElement, pingElement) {
    const startTime = performance.now();
    
    const imgCheck = new Image();
    const separator = url.endsWith('/') ? '' : '/';
    imgCheck.src = url + separator + 'favicon.ico?t=' + Date.now();

    const timeoutId = setTimeout(() => {
        imgCheck.src = "";
        dotElement.classList.add("offline");
        dotElement.classList.remove("online");
        pingElement.textContent = "Timeout";
        // Update dot color to match ping time
        updateDotColor(dotElement, "#666");
    }, 5000);

    imgCheck.onload = () => {
        clearTimeout(timeoutId);
        const endTime = performance.now();
        const pingTime = Math.round(endTime - startTime);
        
        updatePingDisplay(pingElement, dotElement, pingTime);
        dotElement.classList.add("online");
        dotElement.classList.remove("offline");
    };

    imgCheck.onerror = () => {
        clearTimeout(timeoutId);
        dotElement.classList.add("offline");
        dotElement.classList.remove("online");
        pingElement.textContent = "Error";
        // Update dot color to match ping time
        updateDotColor(dotElement, "#666");
    };
}

// Helper function to update ping for other URLs (HEAD requests)
function updatePingForUrl(url, dotElement, pingElement) {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => {
        controller.abort();
        dotElement.classList.add("offline");
        dotElement.classList.remove("online");
        pingElement.textContent = "Timeout";
        // Update dot color to match ping time
        updateDotColor(dotElement, "#666");
    }, 5000);

    const separator = url.endsWith('/') ? '' : '/';
    const cacheBusterUrl = url + separator + '?t=' + Date.now();

    // Measure ping time
    const startTime = performance.now();
    
    fetch(cacheBusterUrl, { method: 'HEAD', signal: controller.signal })
        .then((response) => {
            clearTimeout(timeoutId);
            const endTime = performance.now();
            const pingTime = Math.round(endTime - startTime);
            
            updatePingDisplay(pingElement, dotElement, pingTime);
            if (response.ok) {
                dotElement.classList.add("online");
                dotElement.classList.remove("offline");
            } else {
                dotElement.classList.add("offline");
                dotElement.classList.remove("online");
            }
        })
        .catch((err) => {
            clearTimeout(timeoutId);
            console.log(`${url} is unreachable:`, err);
            dotElement.classList.add("offline");
            dotElement.classList.remove("online");
            pingElement.textContent = "Offline";
            // Update dot color to match ping time
            updateDotColor(dotElement, "#666");
        });
}

// Helper function to update ping display with color coding
function updatePingDisplay(pingElement, dotElement, pingTime) {
    if (pingTime === 0 || pingTime === "Timeout" || pingTime === "Error") {
        pingElement.textContent = pingTime;
        pingElement.style.color = "#666";
        // Also update the dot color
        updateDotColor(dotElement, "#666");
        return;
    }
    
    pingElement.textContent = pingTime + "ms";
    
    if (pingTime < 100) {
        pingElement.style.color = "#4CAF50"; // Green
        updateDotColor(dotElement, "#4CAF50", true); // Green with glow
    } else if (pingTime < 300) {
        pingElement.style.color = "#FFC107"; // Yellow
        updateDotColor(dotElement, "#FFC107", true); // Yellow with glow
    } else {
        pingElement.style.color = "#F44336"; // Red
        updateDotColor(dotElement, "#F44336", true); // Red with glow
    }
}

// Helper function to update dot color and glow effect
function updateDotColor(dotElement, color, isGlowing = false) {
    // Reset any existing glow classes
    dotElement.classList.remove("online");
    
    if (isGlowing) {
        // Set the background color and add glow class for the appropriate color
        dotElement.style.backgroundColor = color;
        
        // Add the glowing effect by setting the correct shadow
        if (color === "#4CAF50") { // Green
            dotElement.style.boxShadow = "0 0 8px #2ecb71, 0 0 15px rgba(46, 203, 113, 0.6)";
        } else if (color === "#FFC107") { // Yellow
            dotElement.style.boxShadow = "0 0 8px #ffc107, 0 0 15px rgba(255, 193, 7, 0.6)";
        } else if (color === "#F44336") { // Red
            dotElement.style.boxShadow = "0 0 8px #f44336, 0 0 15px rgba(244, 67, 54, 0.6)";
        } else {
            dotElement.style.boxShadow = "none";
        }
    } else {
        // Simple color change without glow
        dotElement.style.backgroundColor = color;
        dotElement.style.boxShadow = "none";
    }
}

	// Date and Time Logic
        document.addEventListener('DOMContentLoaded', function() {
            function updateDateTime() {
                const now = new Date();
                const dateTimeString = now.toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });

                // Update the element with class "display-time"
                const elements = document.querySelectorAll('.display-time');
                elements.forEach(function(element) {
                    element.textContent = dateTimeString;
                });
            }

            // Update immediately
            updateDateTime();

            // Update every second
            setInterval(updateDateTime, 1000);
        });
	// Cloudflare Status Logic
    async function checkCloudflareStatus() {
      const statusEl = document.getElementById('cloudflare-status');
      try {
        const response = await fetch('https://www.cloudflarestatus.com/api/v2/summary.json');
        const data = await response.json();
        
        const indicator = data.status.indicator;
        const description = data.status.description;

        if (indicator === 'none') {
          statusEl.innerHTML = `Cloudflare Status: <span class="cloudflare-operational" style="color: green;">All Systems Operational</span>`;
        } else {
          statusEl.innerHTML = `Cloudflare Status: <a class="cloudflare-outage" href="https://www.cloudflarestatus.com/" style="color: orange;">${description}</a>`;
        }
      } catch (error) {
        statusEl.innerHTML = `Cloudflare Status: <span class="cloudflare-error" style="color: red;">Failed to load</span>`;
      }
    }
    checkCloudflareStatus();

    fetch('https://api.ipify.org?format=json')
        .then(response => response.json())
        .then(data => {
            document.getElementById('ip-address').textContent = data.ip;
        })
        .catch(error => {
            document.getElementById('ip-address').textContent = 'Unable to load IP';
        });

/*Old Glitch Effect*/
	.Glitch{
	  animation: glitch 1.74s linear infinite;

	  position: relative;

	}

	@keyframes glitch{
	  2%,64%{
		transform: translate(2px,0) skew(0deg);
	  }
	  4%,60%{
		transform: translate(-2px,0) skew(0deg);
	  }
	  62%{
		transform: translate(0,0) skew(5deg);
	  }
	}

	.Glitch:before,
	.Glitch:after{
	  content: attr(title);
	  position: absolute;
	  left: 0;
	}

	.Glitch:before{
	  animation: glitchTop 1s linear infinite;
	  clip-path: polygon(0 0, 100% 0, 100% 33%, 0 33%);
	  -webkit-clip-path: polygon(0 0, 100% 0, 100% 33%, 0 33%);
	}

	@keyframes glitchTop{
	  2%,64%{
		transform: translate(2px,-2px);
	  }
	  4%,60%{
		transform: translate(-2px,2px);
	  }
	  62%{
